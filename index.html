<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 Forbidden</title>
  <style>
    :root {
      --bg: #f3f0e7;
      --panel: rgba(255, 255, 255, 0.28);
      --line: rgba(34, 34, 34, 0.7);
      --text: #171717;
      --sub: #4b4b4b;
      --hint: #7a2222;
      --input-bg: rgba(255, 255, 255, 0.78);
      --input-line: rgba(26, 26, 26, 0.7);
      --shadow: rgba(0, 0, 0, 0.035);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Georgia",
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      letter-spacing: 0.01em;
    }

    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(120, 120, 120, 0.06), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(90, 90, 90, 0.04), transparent 26%),
        radial-gradient(circle at 50% 80%, rgba(80, 80, 80, 0.03), transparent 34%);
      mix-blend-mode: multiply;
    }

    .page {
      min-height: 100vh;
      padding: 56px 28px 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame {
      width: min(1120px, 100%);
      min-height: 78vh;
      border: 1.5px solid var(--line);
      background: var(--panel);
      box-shadow: 0 14px 40px var(--shadow);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 96px 40px 120px;
    }

    .content {
      width: min(760px, 100%);
      text-align: center;
    }

    .status {
      margin: 0 0 20px;
      font-size: clamp(2.8rem, 8vw, 5.4rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .message {
      margin: 0 auto 12px;
      max-width: 720px;
      font-size: clamp(1rem, 2vw, 1.28rem);
      color: var(--sub);
      line-height: 1.9;
    }

    .sub-message {
      margin: 0 auto 44px;
      max-width: 620px;
      font-size: 0.96rem;
      color: rgba(45, 45, 45, 0.85);
      line-height: 1.8;
    }

    .password-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .input-row {
      width: min(420px, 100%);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .password-input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1.5px solid var(--input-line);
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .password-input:focus {
      border-color: #111;
      background: #fff;
    }

    .password-input::placeholder {
      color: rgba(60, 60, 60, 0.4);
    }

    .submit-btn {
      height: 50px;
      padding: 0 18px;
      border: 1.5px solid var(--input-line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      background: #151515;
      color: #f6f3ea;
    }

    .hint {
      margin-top: 4px;
      font-size: 0.92rem;
      color: var(--hint);
      letter-spacing: 0.02em;
    }

    .response {
      min-height: 24px;
      margin-top: 12px;
      font-size: 0.92rem;
      color: #222;
    }

    .response.error {
      color: #7a2222;
    }

    .response.success {
      color: #204d2c;
    }

    @media (max-width: 720px) {
      .page {
        padding: 20px 14px 32px;
      }

      .frame {
        min-height: 88vh;
        padding: 64px 22px 80px;
      }

      .input-row {
        flex-direction: column;
      }

      .submit-btn {
        width: 100%;
      }

      .status {
        margin-bottom: 24px;
      }

      .sub-message {
        margin-bottom: 34px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="frame">
      <div class="content">
        <h1 class="status">Forbidden.</h1>

        <p class="message">
          You don't have permission to access this resource.
        </p>

        <p class="sub-message">
          Enter your password to continue.
        </p>

        <form class="password-form" id="passwordForm">
          <div class="input-row">
            <input
              type="password"
              id="passwordInput"
              class="password-input"
              placeholder=""
              autocomplete="off"
              aria-label="password"
            />
            <button type="submit" class="submit-btn">Enter</button>
          </div>

          <p class="hint">※ ヒント：2人で行きたかった場所</p></p>
          <div id="response" class="response" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("passwordForm");
    const input = document.getElementById("passwordInput");
    const response = document.getElementById("response");

    // 合言葉はここで変更
    const correctPassword = "三ノ瀬山"or"sannoseyama"or"sannnoseyama";

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const value = input.value.trim().toLowerCase();

      if (!value) {
        response.textContent = "Password required.";
        response.className = "response error";
        return;
      }

      if (value === correctPassword) {
        response.textContent = "Access granted.";
        response.className = "response success";

        // ここを遷移先URLに変える
        setTimeout(() => {
          window.location.href = "./hidden-board.html";
        }, 700);
      } else {
        response.textContent = "Access denied.";
        response.className = "response error";
      }
    });
  </script>
</body>
</html>
